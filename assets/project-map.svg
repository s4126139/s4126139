      <text x="171" y="32" text-anchor="middle" fill="#f3dfb9" font-size="8" font-weight="700">FILTERS</text>
      <text x="171" y="52" text-anchor="middle" fill="#f3dfb9" font-size="8" font-weight="700">CSV EXPORT</text>
      <path d="M224 29h27m-8-8 8 8-8 8" fill="none" stroke="#efc780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M267 53V27l12-9 11 6 14-17" fill="none" stroke="#f1b879" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="304" cy="7" r="4" fill="#f1b879"/>
