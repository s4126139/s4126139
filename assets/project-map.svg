    <text x="50" y="88" fill="#9ee5d1" font-size="11" font-weight="700" letter-spacing="1.8">01 · APPLIED AI · TEAM</text>
    <text x="50" y="117" fill="#f4f1e8" font-size="20" font-weight="700">Fashion Intelligence</text>
    <g transform="translate(50 139)">
      <rect x="0" y="0" width="75" height="58" rx="9" fill="#213942" stroke="#4c8175"/>
      <rect x="10" y="10" width="20" height="18" rx="4" fill="#75c9b4" opacity=".9"/>
      <rect x="38" y="10" width="25" height="4" rx="2" fill="#d3e9df" opacity=".8"/>
      <rect x="38" y="20" width="19" height="4" rx="2" fill="#d3e9df" opacity=".5"/>
      <rect x="10" y="38" width="53" height="5" rx="2.5" fill="#75c9b4" opacity=".58"/>
      <path d="M89 29h29m-8-8 8 8-8 8" fill="none" stroke="#82dbc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="131" y="2" width="76" height="14" rx="7" fill="#29443e"/>
      <rect x="131" y="22" width="76" height="14" rx="7" fill="#29443e"/>
      <rect x="131" y="42" width="76" height="14" rx="7" fill="#29443e"/>
      <text x="169" y="12" text-anchor="middle" fill="#bcecdf" font-size="8" font-weight="700">4 ATTRIBUTES</text>
      <text x="169" y="32" text-anchor="middle" fill="#bcecdf" font-size="8" font-weight="700">EVALUATION</text>
      <text x="169" y="52" text-anchor="middle" fill="#bcecdf" font-size="8" font-weight="700">TOP-K SEARCH</text>
