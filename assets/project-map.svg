      <circle cx="13" cy="8" r="2" fill="#f0c97e"/><circle cx="38" cy="23" r="2" fill="#f0c97e"/><circle cx="63" cy="37" r="2" fill="#f0c97e"/>
      <path d="M91 29h29m-8-8 8 8-8 8" fill="none" stroke="#efc780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="132" y="2" width="78" height="14" rx="7" fill="#514435"/>
      <rect x="132" y="22" width="78" height="14" rx="7" fill="#514435"/>
      <rect x="132" y="42" width="78" height="14" rx="7" fill="#514435"/>
