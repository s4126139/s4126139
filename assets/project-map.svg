    <text x="438" y="227" fill="#c9c5b9" font-size="12">SQLite → parameterised queries → charts</text>
    <text x="438" y="260" fill="#f1b879" font-size="11" font-weight="700" letter-spacing="1">SIX-PAGE DATA EXPLORER</text>
  </g>

