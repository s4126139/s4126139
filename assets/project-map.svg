<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title desc">
  <title id="title">Selected project map</title>
  <desc id="desc">Three illustrated project cards show fashion image classification and retrieval, a SQLite health-data explorer, and a TCP-based HTTP server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14242f"/>
      <stop offset="1" stop-color="#10171f"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f2d9"/>
      <stop offset="1" stop-color="#58bca9"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1cb7c"/>
      <stop offset="1" stop-color="#df9468"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c69d"/>
      <stop offset="1" stop-color="#dc8b72"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="326" rx="22" fill="url(#bg)"/>
  <text x="34" y="38" fill="#9ee5d1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">PROJECT MAP</text>
  <text x="1166" y="38" text-anchor="end" fill="#839597" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">THREE SCALES OF ENGINEERING</text>

