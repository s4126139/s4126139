      <path d="M0 15h82" stroke="#956b5e"/>
      <circle cx="10" cy="9" r="2" fill="#f4b289"/><circle cx="18" cy="9" r="2" fill="#e78f77"/><circle cx="26" cy="9" r="2" fill="#d7bd8d"/>
      <rect x="9" y="23" width="18" height="25" rx="3" fill="#e8b184"/>
      <rect x="32" y="23" width="18" height="25" rx="3" fill="#c68a73"/>
      <rect x="55" y="23" width="18" height="25" rx="3" fill="#987568"/>
      <path d="M94 29h29m-8-8 8 8-8 8" fill="none" stroke="#f2b994" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="135" y="4" width="75" height="14" rx="7" fill="#543d3a"/>
      <rect x="135" y="24" width="75" height="14" rx="7" fill="#543d3a"/>
      <rect x="135" y="44" width="75" height="14" rx="7" fill="#543d3a"/>
      <text x="172" y="14" text-anchor="middle" fill="#f4d2b3" font-size="8" font-weight="700">CATALOGUE</text>
      <text x="172" y="34" text-anchor="middle" fill="#f4d2b3" font-size="8" font-weight="700">REVIEWS</text>
      <text x="172" y="54" text-anchor="middle" fill="#f4d2b3" font-size="8" font-weight="700">CHECKOUT</text>
      <path d="M224 29h26m-8-8 8 8-8 8" fill="none" stroke="#f2b994" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="284" cy="9" rx="25" ry="7" fill="#684b47" stroke="#bb8571"/>
      <path d="M259 9v35c0 4 11 8 25 8s25-4 25-8V9" fill="#4a3938" stroke="#bb8571"/>
      <path d="M259 26c0 4 11 8 25 8s25-4 25-8" fill="none" stroke="#bb8571"/>
      <path d="M259 43c0 4 11 8 25 8s25-4 25-8" fill="none" stroke="#bb8571"/>
