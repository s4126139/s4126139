name: Generate Profile Contributions & Snake

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Yearly Contribution Activity Graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_yearly_graph.py

      - name: Generate Animated Casino Royale Hero Marquee
        run: python scripts/generate_casino_hero.py

      - name: Generate Animated Market Ticker Tape
        run: python scripts/generate_market_ticker.py

      - name: Generate Monte Carlo Stochastic Simulation Graphics
        run: python scripts/generate_monte_carlo.py

      - name: Generate Animated Probability & Game Theory Icons
        run: python scripts/generate_probability_icons.py

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2547A8&color_dots=#FFFFFF,#E8EDF8,#BFCBE9,#788FC9,#2547A8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8FB6FF&color_dots=#161B22,#263A66,#405A9A,#6485D9,#8FB6FF

      - name: Push Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
