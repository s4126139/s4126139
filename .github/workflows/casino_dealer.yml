name: Casino Royale Dealer Bot

on:
  issues:
    types: [opened]
  schedule:
    # Run every 4 hours to simulate active casino floor bets from community high-rollers
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  settle-wager:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'casino:')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Casino Dealer Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
          ISSUE_USER: ${{ github.event.issue.user.login || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/play_casino.py --simulate
          else
            python scripts/play_casino.py
          fi

      - name: Commit & Push Ledger Updates
        run: |
          git config --global user.name "casino-dealer-bot[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(casino): update live ledger and high-roller table [skip ci]" && git push)
